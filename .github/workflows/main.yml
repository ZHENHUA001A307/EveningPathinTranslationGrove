name: 🚀 Study English Feed

on:
  workflow_dispatch: # 支持手动触发
  schedule:
    - cron: '0 10 * * *' # 每天北京时间 18:00 自动运行

permissions:
  contents: write

# ============================================================
# ⚙️ 核心配置区 (修改、维护、新增语言只需在此处调整)
# ============================================================
env:
  LANG_CN: "英语"
  INPUT_FILE: "corpus/input_en.csv"
  PROGRESS_FILE: "progress/last_index_en.txt"
  PROMPT_FILE: "prompts/en_prompt.json"
  BATCH_SIZE: 40
  READING_SPEED: 150
  MODEL_NAME: "gemini-2.5-flash"
# ============================================================

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pandas

      - name: Run Core Process Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python process.py

      - name: Commit Progress and RSS Feed
        run: |
          git config --global user.name "Github Actions Bot"
          git config --global user.email "actions@github.com"
          
          # 🚨 关键改进：为了防止多Action并发冲突，仅追加追踪自己相关的进度文件和feed.xml
          git add feed.xml ${{ env.PROGRESS_FILE }}
          
          if [[ -n "$(git status --porcelain)" ]]; then
            git commit -m "Update ${{ env.LANG_CN }} feed & progress ($(date +'%Y-%m-%d'))"
            git push origin main
          else
            echo "No changes to commit."
          fi
