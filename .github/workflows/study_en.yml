name: Study English Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 1,4'

permissions:
  contents: write

env:
  LANG_CN: "英语"
  INPUT_FILE: "corpus/input_en.csv"
  PROGRESS_FILE: "progress/last_index_en.txt"
  PROMPT_FILE: "prompts/en_prompt.json"
  SLICE_MODE: "by_count"   # 可选: by_topic(默认) 或 by_count
  BATCH_SIZE: 15           # by_count 模式生效，按这个条数切片
  READING_SPEED: 150
  MODEL_NAME: "deepseek-v4-pro"  # 或者是 "deepseek-v4-flash"
  API_URL: "https://api.deepseek.com/chat/completions"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      - name: Run Core Process Engine
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}  # 更换为你的 Deepseek Key
        run: python process.py

      - name: Commit Progress and RSS Feed
        run: |
          git config --global user.name "Github Actions Bot"
          git config --global user.email "actions@github.com"
          
          git add feed.xml ${{ env.PROGRESS_FILE }}
          
          if [[ -n "$(git status --porcelain)" ]]; then
            git commit -m "Update ${{ env.LANG_CN }} feed & progress ($(date +'%Y-%m-%d'))"
            git push origin main
          else
            echo "No changes to commit."
          fi
