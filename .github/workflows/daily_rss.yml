name: HTML to RSS Pusher

on:
  schedule:
    - cron: '0 0 * * 1,4' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install beautifulsoup4

      - name: Run Script
        run: |
          python <<EOF
          import os
          import datetime
          import re
          import math
          from bs4 import BeautifulSoup

          # ================= 配置区 =================
          READING_SPEED = 300   
          RSS_SIZE = 15         
          CONTENT_DIR = 'html_files' 
          repo_full_name = os.getenv('GITHUB_REPOSITORY')
          # ==========================================

          if not os.path.exists(CONTENT_DIR): os.makedirs(CONTENT_DIR, exist_ok=True)

          try:
              with open('progress.txt', 'r') as f:
                  current_index = int(f.read().strip())
          except:
              current_index = 1

          # --- 改进：支持 001-TEST.html 这种命名 ---
          target_file = None
          prefix = f"{current_index:0>3}"
          if os.path.exists(CONTENT_DIR):
              for f_name in os.listdir(CONTENT_DIR):
                  if f_name.startswith(prefix) and f_name.endswith('.html'):
                      target_file = os.path.join(CONTENT_DIR, f_name)
                      break

          if not target_file:
              print(f"DEBUG: 未找到以 {prefix} 开头的 HTML 文件。")
              # 如果没找到，我们创建一个空的 progress 以避免 Git 报错，或者直接退出
              exit(0)

          print(f"正在处理文件: {target_file}")

          with open(target_file, 'r', encoding='utf-8') as f:
              content_html = f.read()

          soup = BeautifulSoup(content_html, 'html.parser')
          word_count = len(soup.get_text().strip())
          reading_time = math.ceil(word_count / READING_SPEED)
          
          time_header = f"<div style='color: #888; margin-bottom: 10px;'>⏱ 预计阅读时间：{reading_time} 分钟 ({word_count} 字)</div><hr>"
          full_content = time_header + content_html

          title_tag = soup.find(['h1', 'th', 'title'])
          entry_title = title_tag.get_text() if title_tag else f"Lesson {current_index}"
          
          pub_date = datetime.datetime.now().strftime('%a, %d %b %Y %H:%M:%S +0000')
          
          new_item = f"""        <item>
              <title><![CDATA[{entry_title}]]></title>
              <description><![CDATA[{full_content}]]></description>
              <pubDate>{pub_date}</pubDate>
              <guid isPermaLink="false">lesson-{current_index}-{datetime.datetime.now().timestamp()}</guid>
          </item>"""

          all_items = [new_item]
          if os.path.exists('feed.xml'):
              with open('feed.xml', 'r', encoding='utf-8') as f:
                  old_feed = f.read()
                  old_items = re.findall(r'<item>.*?</item>', old_feed, re.DOTALL)
                  all_items.extend(old_items)

          all_items = all_items[:RSS_SIZE]
          items_xml = "\n".join(all_items)

          rss_feed = f"""<?xml version="1.0" encoding="UTF-8" ?>
          <rss version="2.0">
          <channel>
              <title>我的外语学习推送</title>
              <link>https://github.com/{repo_full_name}</link>
              <description>基于 AI 讲解生成的每日外语阅读</description>
          {items_xml}
          </channel>
          </rss>"""

          with open('feed.xml', 'w', encoding='utf-8') as f: f.write(rss_feed)
          with open('progress.txt', 'w') as f: f.write(str(current_index + 1))
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # 使用 git add . 并在提交前检查是否有变化，防止报错
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update RSS content" && git push)
