name: HTML to RSS Pusher

on:
  schedule:
    - cron: '0 0 * * 1,4' 
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install beautifulsoup4

      - name: Run Script
        run: |
          python <<EOF
          import os
          import datetime
          import re
          import math
          from bs4 import BeautifulSoup

          # ================= 配置区 =================
          READING_SPEED = 300   # 每分钟阅读字数
          RSS_SIZE = 15         # RSS 保留的条目数
          CONTENT_DIR = 'html_files' # 存放 HTML 文件的文件夹
          repo_full_name = os.getenv('GITHUB_REPOSITORY')
          # ==========================================

          if not os.path.exists(CONTENT_DIR): os.makedirs(CONTENT_DIR, exist_ok=True)

          # 读取进度
          try:
              with open('progress.txt', 'r') as f:
                  current_index = int(f.read().strip())
          except:
              current_index = 1

          # 寻找目标 HTML 文件 (支持 001.html 或 1.html)
          search_patterns = [f"{current_index:0>3}.html", f"{current_index}.html"]
          target_file = None
          for pattern in search_patterns:
              path = os.path.join(CONTENT_DIR, pattern)
              if os.path.exists(path):
                  target_file = path
                  break

          if not target_file:
              print(f"DEBUG: 未找到序号 {current_index} 的 HTML 文件，停止运行。")
              exit(0)

          # 读取 HTML 内容
          with open(target_file, 'r', encoding='utf-8') as f:
              content_html = f.read()

          # 计算字数和阅读时间 (剥离 HTML 标签后计算文字)
          soup = BeautifulSoup(content_html, 'html.parser')
          plain_text = soup.get_text()
          word_count = len(plain_text.strip())
          reading_time = math.ceil(word_count / READING_SPEED)
          
          # 构造页眉信息
          time_header = f"<div style='color: #888; margin-bottom: 10px;'>⏱ 预计阅读时间：{reading_time} 分钟 ({word_count} 字)</div><hr>"
          full_content = time_header + content_html

          # 构造新的 RSS Item
          # 标题尝试抓取 <h1> 或文件名
          title_tag = soup.find(['h1', 'h2', 'title'])
          entry_title = title_tag.get_text() if title_tag else f"Lesson {current_index}: {os.path.basename(target_file)}"
          
          pub_date = datetime.datetime.now().strftime('%a, %d %b %Y %H:%M:%S +0000')
          
          new_item = f"""        <item>
              <title><![CDATA[{entry_title}]]></title>
              <description><![CDATA[{full_content}]]></description>
              <pubDate>{pub_date}</pubDate>
              <guid isPermaLink="false">lesson-{current_index}</guid>
          </item>"""

          # 合并旧的 RSS 条目
          all_items = [new_item]
          if os.path.exists('feed.xml'):
              with open('feed.xml', 'r', encoding='utf-8') as f:
                  old_feed = f.read()
                  # 正则提取旧的 item
                  old_items = re.findall(r'<item>.*?</item>', old_feed, re.DOTALL)
                  all_items.extend(old_items)

          # 限制 RSS 长度并组合
          all_items = all_items[:RSS_SIZE]
          items_xml = "\n".join(all_items)

          # 生成最终的 RSS XML
          rss_feed = f"""<?xml version="1.0" encoding="UTF-8" ?>
          <rss version="2.0">
          <channel>
              <title>我的外语学习推送</title>
              <link>https://github.com/{repo_full_name}</link>
              <description>基于 AI 讲解生成的每日外语阅读</description>
          {items_xml}
          </channel>
          </rss>"""

          # 写回文件
          with open('feed.xml', 'w', encoding='utf-8') as f: f.write(rss_feed)
          with open('progress.txt', 'w') as f: f.write(str(current_index + 1))
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml progress.txt
          git commit -m "Update RSS: Lesson content" || echo "Nothing to commit"
          git push
