name: HTML to RSS Pusher

on:
  schedule:
    - cron: '0 0 * * 1,4' 
  workflow_dispatch: # 支持手动点击 Run workflow

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install beautifulsoup4

      - name: Run Script
        run: |
          python <<EOF
          import os
          import datetime
          import re
          import math
          import sys
          from bs4 import BeautifulSoup

          # ================= 配置区 =================
          READING_SPEED = 300   
          RSS_SIZE = 15         
          CONTENT_DIR = 'html_files' 
          repo_full_name = os.getenv('GITHUB_REPOSITORY')
          # ==========================================

          # 1. 读取进度
          try:
              if os.path.exists('progress.txt'):
                  with open('progress.txt', 'r') as f:
                      current_index = int(f.read().strip())
              else:
                  current_index = 1
          except Exception as e:
              print(f"读取进度失败: {e}")
              current_index = 1

          print(f">>> 当前目标序号: {current_index}")

          # 2. 搜索 HTML 文件 (同时搜索 html_files 目录和根目录)
          target_file = None
          prefix = f"{current_index:0>3}"
          search_locations = [CONTENT_DIR, '.'] 
          
          for loc in search_locations:
              if os.path.exists(loc):
                  print(f"正在 {loc} 目录中搜索前缀为 {prefix} 的文件...")
                  files = [f for f in os.listdir(loc) if f.startswith(prefix) and f.endswith('.html')]
                  if files:
                      target_file = os.path.join(loc, files[0])
                      break

          if not target_file:
              print(f"❌ 停止运行: 未找到以 {prefix} 开头的 HTML 文件。")
              # 使用 sys.exit(1) 会让 Action 显示失败，方便你排查
              sys.exit(1) 

          print(f"✅ 找到目标文件: {target_file}")

          # 3. 处理 HTML
          try:
              with open(target_file, 'r', encoding='utf-8') as f:
                  content_html = f.read()

              soup = BeautifulSoup(content_html, 'html.parser')
              # 提取纯文本计算阅读时间
              plain_text = soup.get_text().strip()
              word_count = len(plain_text)
              reading_time = math.ceil(word_count / READING_SPEED)
              
              time_header = f"<div style='color: #888; margin-bottom: 10px;'>⏱ 预计阅读时间：{reading_time} 分钟 ({word_count} 字)</div><hr>"
              full_content = time_header + content_html

              # 寻找标题：优先找表格第一行 th 或 h1
              title_tag = soup.find(['th', 'h1', 'title'])
              entry_title = title_tag.get_text().strip() if title_tag else f"Lesson {current_index}"
              
              pub_date = datetime.datetime.now().strftime('%a, %d %b %Y %H:%M:%S +0000')
              
              new_item = f"""        <item>
              <title><![CDATA[{entry_title}]]></title>
              <description><![CDATA[{full_content}]]></description>
              <pubDate>{pub_date}</pubDate>
              <guid isPermaLink="false">lesson-{current_index}-{int(datetime.datetime.now().timestamp())}</guid>
          </item>"""

              # 4. 更新 feed.xml
              all_items = [new_item]
              if os.path.exists('feed.xml'):
                  with open('feed.xml', 'r', encoding='utf-8') as f:
                      old_feed = f.read()
                      old_items = re.findall(r'<item>.*?</item>', old_feed, re.DOTALL)
                      all_items.extend(old_items)

              all_items = all_items[:RSS_SIZE]
              items_xml = "\n".join(all_items)

              rss_feed = f"""<?xml version="1.0" encoding="UTF-8" ?>
          <rss version="2.0">
          <channel>
              <title>外语学习推送</title>
              <link>https://github.com/{repo_full_name}</link>
              <description>基于 AI 讲解生成的每日外语阅读</description>
          {items_xml}
          </channel>
          </rss>"""

              with open('feed.xml', 'w', encoding='utf-8') as f: 
                  f.write(rss_feed)
              with open('progress.txt', 'w') as f: 
                  f.write(str(current_index + 1))
              
              print(f"🎉 成功生成 feed.xml，并更新进度至 {current_index + 1}")

          except Exception as e:
              print(f"❌ 处理 HTML 内容出错: {e}")
              sys.exit(1)
          EOF

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          # 只有在有变动时才提交，防止空提交报错
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update RSS: Lesson $(cat progress.txt)"
            git push
          else
            echo "No changes to commit"
          fi
