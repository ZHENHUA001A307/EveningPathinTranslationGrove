name: Auto Learning Flow

on:
  push:
    paths:
      - 'input/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12' # 升级到最新稳定版

      - name: Install Dependencies
        # 安装全新的 google-genai 库
        run: pip install google-genai beautifulsoup4

      - name: Run AI Processor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/process.py

      - name: Commit and Push
        run: |
          git config --global user.name "StudyBot"
          git config --global user.email "bot@github.com"
          git add .
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update: AI Generated Content"
            git push
          fi
